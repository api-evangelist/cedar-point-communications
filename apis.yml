name: Cedar Point Communications
description: >-
  Cedar Point Communications, Inc. is a telecommunications software company that enables cable,
  wireline, and wireless operators to simplify the cost-effective delivery of VoIP and multimedia
  services. Its flagship SAFARI C3 is an integrated switching platform supporting up to 250,000 voice
  lines, complemented by the SafariView management tool and the SafariFusion suite (Application
  Platform, Residential Communication Application, Registration Routing Application, and Visual
  Communications Suite). Cedar Point Communications became a subsidiary of GENBAND following its 2010
  acquisition. It was surfaced as a portfolio company of Battery Ventures and added to the API
  Evangelist network. No public API, developer portal, SDKs, or machine-readable specifications were
  found during enrichment; this profile captures the company identity and probed domain security only.
